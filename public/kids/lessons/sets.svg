<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img"><rect width="640" height="270" rx="18" fill="#fff8e8"/><g font-family="Arial,sans-serif" font-size="21" fill="#203c46"><text x="28" y="40">Отдели общите, за да не ги броиш два пъти</text><g stroke="#203c46" stroke-width="3"><rect x="30" y="85" width="185" height="100" fill="#b9d9bd"/><rect x="215" y="85" width="185" height="100" fill="#f5cf75"/><rect x="400" y="85" width="210" height="100" fill="#b9d9bd"/></g><text x="60" y="140">само А</text><text x="260" y="140">А и Б</text><text x="460" y="140">само Б</text><text x="30" y="235">Всички в А = само А + общите.</text></g></svg>